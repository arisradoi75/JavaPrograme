<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Cartilor</title>
</head>
<body>

<h1 th:text="${str}"></h1>

<table border="1">
    <tr>
        <th>ISBN</th>
        <th>Titlu</th>
        <th>Autor</th>
    </tr>

    <tr th:each="c : ${carti}">
        <td th:text="${c.isbn}"></td>
        <td th:text="${c.titlu}"></td>
        <td th:text="${c.autor}"></td>
    </tr>
</table>

</body>
</html>

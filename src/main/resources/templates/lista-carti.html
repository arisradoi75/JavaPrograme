<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Cartilor</title>
</head>
<body>

<h1 th:text="${str}"></h1>

<!-- Mesaj după acțiuni: adăugare/ștergere -->
<p th:text="${mesaj}" style="color: green;"></p>

<!-- Formular pentru ADĂUGARE carte -->
<h2>Adauga o carte noua</h2>

<form action="/adauga-carte" method="get">
    <label>ISBN:</label>
    <input type="text" name="isbn" required>
    <br><br>

    <label>Titlu:</label>
    <input type="text" name="titlu" required>
    <br><br>

    <label>Autor:</label>
    <input type="text" name="autor" required>
    <br><br>

    <button type="submit">Adauga carte</button>
</form>

<hr>

<!-- Tabel cu LISTA CARTILOR -->
<table border="1">
    <tr>
        <th>ISBN</th>
        <th>Titlu</th>
        <th>Autor</th>
        <th>Actiuni</th>
    </tr>

    <tr th:each="c : ${carti}">
        <td th:text="${c.isbn}"></td>
        <td th:text="${c.titlu}"></td>
        <td th:text="${c.autor}"></td>

        <!-- Button STERGERE -->
        <td>
            <a th:href="@{'/sterge-carte'(isbn=${c.isbn})}"
               onclick="return confirm('Sigur vrei să stergi această carte?');">
                Sterge
            </a>
        </td>
    </tr>
</table>

</body>
</html>
